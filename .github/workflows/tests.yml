name: Offline experiment tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r main_experiment/requirements.txt
      - run: python -m unittest discover -s experiment -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m unittest discover -s main_experiment -p 'test_*.py' -v
      - run: python -m main_experiment plan --config main_experiment/config.example.json
